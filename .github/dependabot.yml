version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    ignore:
      # This exact release has no compatible build import for our net48 tests.
      # Newer releases remain eligible for review and a real coverage check.
      - dependency-name: coverlet.collector
        versions: ["10.0.1"]
    groups:
      test-tooling:
        patterns: ["*"]
