name: Build KeeFetch

on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Check version consistency
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            ./eng/check-version.ps1 -Tag $env:GITHUB_REF
          } else {
            ./eng/check-version.ps1
          }

      - name: Check PLGX manifest matches tracked sources
        shell: pwsh
        run: ./eng/check-plgx-manifest.ps1

      - name: Test release workflow safeguards
        shell: pwsh
        run: ./eng/test-release-workflow.ps1

      - name: Install KeePass
        shell: pwsh
        run: |
          choco install keepass.install --version=2.60.0 --no-progress -y --allow-downgrade
          $keepassDir = "C:\Program Files\KeePass Password Safe 2"
          $kpExe = Join-Path $keepassDir "KeePass.exe"
          if (!(Test-Path $kpExe)) {
            Write-Error "KeePass.exe not found at $kpExe"
            exit 1
          }
          $version = (Get-Item $kpExe).VersionInfo.FileVersion
          Write-Output "KeePass version: $version"
          Write-Output "KEEPASS_DIR=$keepassDir" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: |
          dotnet restore KeeFetch.csproj
          dotnet restore KeeFetch.Tests/KeeFetch.Tests.csproj

      - name: Build DLL
        shell: pwsh
        run: |
          dotnet build KeeFetch.csproj --configuration Release --no-restore -p:KeePassPath="$env:KEEPASS_DIR"

      - name: Check profile data consistency
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File eng/export-profile-data.ps1 -Check

      - name: Verify C# 5 compatibility
        shell: pwsh
        run: |
          dotnet build KeeFetch.csproj --configuration Release --no-restore `
            -p:KeePassPath="$env:KEEPASS_DIR" `
            -p:LangVersion=5 `
            -warnaserror

      - name: Test
        shell: pwsh
        run: |
          dotnet build KeeFetch.Tests/KeeFetch.Tests.csproj --configuration Release --no-restore -p:KeePassPath="$env:KEEPASS_DIR"
          Copy-Item -Path "$env:KEEPASS_DIR\KeePass.exe" -Destination "KeeFetch.Tests\bin\Release\net48\"
          dotnet test KeeFetch.Tests/KeeFetch.Tests.csproj --configuration Release --no-build

      - name: Validate benchmark harness and corpora
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File eng/benchmark/test-benchmark-harness.ps1
          Import-Module .\eng\benchmark\BenchmarkHarness.psm1 -Force
          Test-KeeFetchCorpus `
            -CsvPath .\KeeFetch.Tests\Fixtures\ProviderCorpus\v1\public-sites.csv `
            -VocabularyPath .\KeeFetch.Tests\Fixtures\ProviderCorpus\v1\categories.json | Out-Null

      - name: Create PLGX
        shell: pwsh
        run: |
          $plgxSrc = "$env:RUNNER_TEMP\KeeFetch"
          New-Item -ItemType Directory -Path $plgxSrc -Force | Out-Null

          # Copy only the source files needed for plgx-create (exclude TestCompile.cs)
          Copy-Item -Path "*.cs" -Destination $plgxSrc -Exclude "TestCompile.cs"
          Copy-Item -Path "SettingsForm.resx" -Destination $plgxSrc
          Copy-Item -Path "Properties" -Destination $plgxSrc -Recurse
          Copy-Item -Path "IconProviders" -Destination $plgxSrc -Recurse
          Copy-Item -Path "FetchProfiles" -Destination $plgxSrc -Recurse
          Copy-Item -Path "IconSelection" -Destination $plgxSrc -Recurse
          Copy-Item -Path "Assets" -Destination $plgxSrc -Recurse

          # KeePass plgx-create needs a legacy-style .csproj — SDK-style won't work.
          Copy-Item -Path "KeeFetch.plgx.csproj" -Destination "$plgxSrc\KeeFetch.csproj"

          # Verify all expected source files are present
          $expectedFiles = @(
            "KeeFetchExt.cs", "FaviconDownloader.cs", "FaviconDialog.cs",
            "Configuration.cs", "SettingsForm.cs", "SettingsForm.Designer.cs",
            "Logger.cs", "Util.cs", "SharedHttp.cs", "AndroidAppMapper.cs",
            "Properties\AssemblyInfo.cs", "KeeFetch.csproj",
            "IconSelection\IconSelector.cs", "IconSelection\IconCandidate.cs",
            "Assets\Icons\keefetch-app.png", "Assets\Icons\keefetch-download.png",
            "Assets\Icons\keefetch-settings.png",
            "FetchProfiles\FetchExecutionPolicy.cs",
            "FetchProfiles\ProviderDefinition.cs",
            "FetchProfiles\FetchProfileCatalog.cs",
            "FetchProfiles\FetchProfileDefinition.cs",
            "FetchProfiles\FetchProfileCatalog.Generated.cs",
            "FetchProfiles\LegacyProfileMigration.cs"
          )
          $missing = $expectedFiles | Where-Object { !(Test-Path (Join-Path $plgxSrc $_)) }
          if ($missing) {
            Write-Error "Missing files in PLGX staging: $($missing -join ', ')"
            exit 1
          }

          Write-Output "=== PLGX source contents ==="
          Get-ChildItem $plgxSrc -Recurse | ForEach-Object { Write-Output $_.FullName }

          $keepassExe = "$env:KEEPASS_DIR\KeePass.exe"
          Write-Output "=== Running plgx-create ==="
          $proc = Start-Process -FilePath $keepassExe -ArgumentList "--plgx-create", "`"$plgxSrc`"" -Wait -PassThru -NoNewWindow
          Write-Output "KeePass exited with code: $($proc.ExitCode)"

          if ($proc.ExitCode -ne 0) {
            Write-Error "KeePass plgx-create failed with exit code $($proc.ExitCode)"
            exit 1
          }

          # KeePass creates the plgx next to the source folder, named after the folder
          $plgxFile = "$env:RUNNER_TEMP\KeeFetch.plgx"

          if (!(Test-Path $plgxFile)) {
            Write-Output "=== Searching for .plgx files ==="
            Get-ChildItem "$env:RUNNER_TEMP" -Filter "*.plgx" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.FullName }
            Write-Error "PLGX file not found at $plgxFile"
            exit 1
          }

          $fileInfo = Get-Item $plgxFile
          Write-Output "PLGX created: $plgxFile ($($fileInfo.Length) bytes)"
          Write-Output "PLGX_PATH=$plgxFile" >> $env:GITHUB_ENV

      - name: Verify PLGX
        shell: pwsh
        run: |
          $plgxFile = $env:PLGX_PATH
          $data = [System.IO.File]::ReadAllBytes($plgxFile)

          # Dump PLGX header (TLV entries) for debugging
          Write-Output "=== PLGX header ($($data.Length) bytes) ==="
          $pos = 12
          while ($pos + 6 -lt $data.Length) {
            $type = [BitConverter]::ToUInt16($data, $pos)
            $len  = [BitConverter]::ToInt32($data, $pos + 2)
            if ($type -eq 0 -and $len -eq 0) { Write-Output "[$pos] END"; break }

            $desc = switch ($type) {
              1 { "FileUuid" }; 2 { "BaseFileName" }; 3 { "PrereqOs" }
              4 { "FileEntry" }; 5 { "PrereqKP" }; 6 { "CreationTime" }
              7 { "GeneratorName" }; 8 { "GeneratorVersion" }
              default { "Unknown" }
            }

            if ($type -ne 4) {
              $raw = [BitConverter]::ToString($data, $pos + 6, [Math]::Min($len, 32))
              Write-Output "[$pos] Type=$type ($desc) Len=$len Data=$raw"
            } else {
              $sp = $pos + 6
              $st = [BitConverter]::ToUInt16($data, $sp); $sp += 2
              $nl = [BitConverter]::ToInt32($data, $sp);  $sp += 4
              $nm = [System.Text.Encoding]::UTF8.GetString($data, $sp, $nl)
              Write-Output "[$pos] Type=4 (FileEntry) Len=$len Name=$nm"
            }
            $pos += 6 + $len
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v6
        with:
          name: KeeFetch.dll
          path: bin/Release/net48/KeeFetch.dll
          if-no-files-found: error

      - name: Upload PLGX artifact
        uses: actions/upload-artifact@v6
        with:
          name: KeeFetch.plgx
          path: ${{ env.PLGX_PATH }}
          if-no-files-found: error

      - name: Compute release checksums
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          $lines = @()
          foreach ($file in @("bin\Release\net48\KeeFetch.dll", $env:PLGX_PATH)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path -Leaf $file)"
          }
          [System.IO.File]::WriteAllLines($out, $lines)
          Get-Content $out
          Write-Output "SHA256SUMS_PATH=$out" >> $env:GITHUB_ENV

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS.txt
          path: ${{ env.SHA256SUMS_PATH }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download tested DLL
        uses: actions/download-artifact@v8
        with:
          name: KeeFetch.dll
          path: release

      - name: Download tested PLGX
        uses: actions/download-artifact@v8
        with:
          name: KeeFetch.plgx
          path: release

      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS.txt
          path: release

      - name: Verify release checksums
        shell: pwsh
        run: |
          $expected = @('KeeFetch.dll', 'KeeFetch.plgx')
          $seen = @()
          $lines = @(Get-Content -LiteralPath 'release/SHA256SUMS.txt' -ErrorAction Stop)
          if ($lines.Count -ne $expected.Count) { throw 'Expected exactly two release checksums.' }
          foreach ($line in $lines) {
            if ($line -cnotmatch '^([0-9a-f]{64})  (KeeFetch\.(?:dll|plgx))$') {
              throw 'Invalid release checksum entry.'
            }
            $hash = $Matches[1]
            $name = $Matches[2]
            if ($seen -contains $name) { throw "Duplicate checksum: $name" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "release/$name" -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($actual -cne $hash) { throw "Checksum mismatch: $name" }
            $seen += $name
          }
          foreach ($name in $expected) {
            if ($seen -notcontains $name) { throw "Missing checksum: $name" }
          }

      - name: Create GitHub Release
        # softprops/action-gh-release v3.0.3, pinned by commit for supply-chain safety
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          fail_on_unmatched_files: true
          files: |
            release/KeeFetch.dll
            release/KeeFetch.plgx
            release/SHA256SUMS.txt
