name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - site/**
      - eng/sync-site-profiles.py
      - eng/verify-site.py
      - eng/test-verify-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate and build website
        run: |
          python3 eng/sync-site-profiles.py --check
          python3 eng/verify-site.py
          python3 eng/test-verify-site.py
          node --check site/assets/js/site.js
          node --check site/assets/js/theme.js
          node --check site/assets/js/motion.js
          python3 site/build.py
          python3 eng/verify-site.py --site site/dist

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
