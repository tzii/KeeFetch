name: Website quality

on:
  push:
    branches: [codex/site-icon-studio-2026-09-10]
  pull_request:
    paths:
      - 'site/**'
      - 'eng/site/**'
      - '.github/workflows/site-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify source contracts and build
        run: |
          python3 eng/sync-site-profiles.py --check
          python3 eng/verify-site.py
          python3 eng/test-verify-site.py
          node --check site/assets/js/site.js
          node --check site/assets/js/theme.js
          git diff --check
          python3 site/build.py
      - name: Impeccable source scan
        run: |
          mkdir -p site-qa
          set +e
          npx --yes impeccable@4.1.0 detect --json site/ > site-qa/impeccable-source.json
          status=$?
          echo "Impeccable exit status: $status" | tee site-qa/impeccable-status.txt
          # Findings (2) are reviewed with screenshots, not suppressed. Failure to scan (1) fails the job.
          test "$status" -eq 0 -o "$status" -eq 2
      - name: Save website and source for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: keefetch-website-source
          path: |
            site/
            eng/
            docs/
            .agent/
            AGENTS.md
            README.md
            CHANGELOG.md
            site-qa/
          include-hidden-files: true
          retention-days: 14

  browsers:
    runs-on: ubuntu-latest
    needs: website
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build production output
        run: python3 site/build.py
      - name: Install pinned test tools
        working-directory: eng/site
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Install browser
        working-directory: eng/site
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Record tooling
        working-directory: eng/site
        run: |
          mkdir -p ../../site-qa
          npx playwright --version > ../../site-qa/tooling.txt
          npm ls --depth=0 >> ../../site-qa/tooling.txt
      - name: Test pages, accessibility, preferences and failures
        working-directory: eng/site
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Save screenshots, traces and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: keefetch-browser-${{ matrix.browser }}
          path: |
            site-qa/
            eng/site/package-lock.json
          retention-days: 14
